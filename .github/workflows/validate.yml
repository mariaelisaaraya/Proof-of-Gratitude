name: Validar contribuciones

on:
  pull_request:
    paths:
      - 'src/content/community/**'
      - 'data/hitos.json'
      - 'src/content/config.ts'
      - 'src/pages/**'
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar extensiones de las firmas
        run: |
          invalid_files=$(find src/content/community -type f ! -name '*.json' -print)
          if [ -n "$invalid_files" ]; then
            echo "Todos los archivos de src/content/community/ deben terminar en .json."
            echo 'Renombrá cada archivo con git mv "ruta-actual" "src/content/community/tu-usuario.json".'
            printf '%s\n' "$invalid_files"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
